<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local business — Board Bored Bakersfield</title>
<meta name="description" content="One page for a Bakersfield business: its deals and what's on. Scan the code to claim.">
<style>
  :root{--ink:#141116;--pap:#faf7f2;--card:#fffdfa;--acc:#b83a14;--acc2:#0f6f5a;--line:#8a837d;--mut:#5e5852;--body:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--ink:#f4efe9;--pap:#16130f;--card:#201c17;--acc:#ff8a5c;--acc2:#4fd1b0;--line:#6e665e;--mut:#b9b1a8}}
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:18px}
  body{font-family:var(--body);background:var(--pap);color:var(--ink);line-height:1.5;padding:16px 16px 56px}
  .wrap{max-width:560px;margin:0 auto}
  a.back{display:inline-block;min-height:48px;line-height:48px;color:var(--acc2);font-weight:700;text-decoration:none}
  h1{font-size:2rem;line-height:1.1;margin:4px 0 4px}
  .sub{color:var(--mut);margin-bottom:14px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .badge{display:inline-block;background:var(--acc);color:#fff;font-weight:800;border-radius:999px;padding:4px 12px;margin:4px 0}
  .btn,button{font:inherit;font-weight:800;min-height:52px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--pap);padding:0 18px;cursor:pointer;width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .btn.alt,button.alt{background:transparent;color:var(--ink)}
  .ev{padding:10px 0;border-top:1px solid var(--line)}.ev:first-of-type{border-top:0}
  .ev b{display:block}.small{font-size:.85rem;color:var(--mut)}
  #qr{display:flex;justify-content:center;padding:8px}#qr svg{width:180px;height:180px}
  .printonly{display:none}
  @media print{
    @page{size:letter portrait;margin:0.6in}
    body{background:#fff;color:#000;padding:0}
    .noprint{display:none!important}
    .printonly{display:block;text-align:center}
    .card{border:0;padding:0}
    h1{font-size:44pt}
    .badge{background:#000!important;color:#fff!important;font-size:22pt;padding:6px 20px}
    #qr svg{width:3.6in;height:3.6in}
    .scan{font-size:26pt;font-weight:900;margin-top:10px}
    .url{font-size:13pt;margin-top:6px;word-break:break-all}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back noprint" href="index.html">&larr; Back to the map</a>
  <h1 id="name">&nbsp;</h1>
  <p class="sub" id="sub"></p>
  <div id="deals"></div>
  <div class="card printonly"><div class="scan">Scan to claim your deal</div><div class="url" id="url"></div></div>
  <div class="card"><div id="qr" aria-label="QR code for this page"></div>
    <button class="noprint" id="share">Share this page</button>
    <button class="noprint alt" id="print">Print one page</button>
    <p class="small noprint" style="margin-top:8px">One page, one code. Print it once instead of posting flyers all over town. Changes you make in your dashboard show up here instantly.</p></div>
  <div class="card noprint"><strong>Coming up here</strong><div id="events"><p class="small">Loading&hellip;</p></div></div>
</div>
<script src="../lib/api.js"></script>
<script src="../lib/qrcode.js"></script>
<script>
(function () {
  var API = (window.bbApi && window.bbApi.API_BASE || "").replace(/\/+$/, "");
  try { var q = new URLSearchParams(location.search).get("api"); if (q && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) API = q.replace(/\/+$/, ""); } catch (e) {}
  var shop = (new URLSearchParams(location.search).get("shop") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  var self = location.origin + location.pathname + "?shop=" + encodeURIComponent(shop);
  $("url").textContent = self;
  try { var qr = qrcode(0, "M"); qr.addData(self); qr.make(); $("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2 }); } catch (e) { $("qr").textContent = self; }
  $("print").onclick = function () { window.print(); };
  $("share").onclick = function () {
    var d = { title: document.title, text: "Deals and events in Bakersfield:", url: self };
    if (navigator.share) navigator.share(d).catch(function () {}); else if (navigator.clipboard) navigator.clipboard.writeText(self).then(function () { $("share").textContent = "Link copied"; });
  };
  var norm = function (s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); };
  fetch(API + "/api/shop-deals?shop=" + encodeURIComponent(shop), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
    var list = (j && j.deals) || [], box = $("deals");
    if (!list.length) { $("name").textContent = "This business"; $("sub").textContent = "No live deal right now. See what's on below."; return; }
    var s = list[0].shop; $("name").textContent = s.name; document.title = s.name + " — Board Bored Bakersfield";
    $("sub").textContent = "Follow @" + s.ig + " for more.";
    list.forEach(function (d) {
      var c = el("div", "card"); c.appendChild(el("div", "badge", d.badge)); c.appendChild(el("p", null, d.summary));
      if (d.terms) c.appendChild(el("p", "small", d.terms));
      var a = el("a", "btn noprint", "Claim this deal (free)"); a.href = "deals.html?shop=" + encodeURIComponent(shop) + (API !== (window.bbApi && window.bbApi.API_BASE || "").replace(/\/+$/, "") ? "&api=" + encodeURIComponent(API) : "");
      c.appendChild(a); box.appendChild(c);
    });
    return fetch("../data/board.json").then(function (r) { return r.json(); }).then(function (b) {
      var n = norm(s.name), today = new Date().toISOString().slice(0, 10), evs = $("events"); evs.textContent = "";
      var mine = (b.city_events || []).filter(function (e) { var v = norm(e.venue); return v && (v.indexOf(n) >= 0 || n.indexOf(v) >= 0) && ((e.schedule && (e.schedule.weekday !== undefined || e.schedule.ongoing)) || (e.schedule && e.schedule.date >= today)); }).slice(0, 8);
      if (!mine.length) evs.appendChild(el("p", "small", "Nothing listed yet."));
      mine.forEach(function (e) { var row = el("div", "ev"); row.appendChild(el("b", null, e.name)); row.appendChild(el("span", "small", e.when || "")); evs.appendChild(row); });
    });
  }).catch(function () { $("sub").textContent = "Couldn't load. Check your connection."; });
})();
</script>
</body>
</html>
