<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect — Board Bored</title>
<meta name="description" content="Quick way to swap contact info at an event — vendors, artists, musicians, anyone worth following up with.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ca421a">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<style>
  :root{--ink:#141116;--pap:#faf7f2;--card:#fff;--acc:#ca421a;--acc2:#167f68;--line:#948d88;--mut:#5a5450;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:var(--pap);color:var(--ink);
    min-height:100dvh;padding:20px 16px 40px}
  .wrap{width:100%;max-width:520px;margin:0 auto}
  .mark{font-size:13px;letter-spacing:4px;font-weight:900;text-transform:uppercase;color:var(--acc);text-decoration:none}
  h1{font-size:clamp(26px,7vw,32px);line-height:1.05;letter-spacing:-.5px;margin:10px 0 8px}
  .tag{color:var(--mut);font-size:15px;line-height:1.5;margin-bottom:16px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px}
  label:first-of-type{margin-top:0}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:14px;border:1.5px solid var(--line);
    border-radius:11px;background:#fffdfa}
  input:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
  textarea{min-height:64px;resize:vertical}
  .roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .roles button{flex:1;min-width:86px;appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);
    font:inherit;font-weight:800;font-size:14px;border-radius:12px;padding:13px 6px;cursor:pointer;min-height:48px}
  .roles button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;border-radius:14px;
    padding:16px;width:100%;margin-top:18px;color:#fff;background:var(--acc);min-height:52px}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.secondary{background:var(--ink)}
  .status{font-size:14px;font-weight:700;margin-top:10px;min-height:18px}
  .status.err{color:#b3261e}
  .success{display:none;text-align:center;padding:26px 10px}
  .success .big{font-size:48px;margin-bottom:8px}
  .eventpill{display:inline-block;font-size:12px;font-weight:800;color:var(--acc2);background:rgba(22,127,104,.1);
    border-radius:20px;padding:6px 14px;margin-bottom:14px}
  footer{margin-top:22px;text-align:center;font-size:12px;color:var(--mut);line-height:1.7}
  footer a{color:var(--acc2);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="mark" href="../">● Board Bored</a>
  <h1>Let's stay in touch</h1>
  <p class="tag">Vendor, artist, musician, or just here for the vibe — leave your info and we'll follow up. Ten seconds, no account.</p>
  <div class="eventpill" id="eventPill" style="display:none"></div>

  <form id="formConnect" class="card" novalidate>
    <label for="cName">Name</label>
    <input id="cName" type="text" placeholder="What should we call you?" autocomplete="name" required>

    <label>You're a…</label>
    <div class="roles" id="roles">
      <button type="button" data-r="vendor">Vendor</button>
      <button type="button" data-r="artist">Artist</button>
      <button type="button" data-r="musician">Musician</button>
      <button type="button" data-r="business">Business</button>
      <button type="button" data-r="visitor">Just here</button>
    </div>

    <label for="cOrg">Business or act name (optional)</label>
    <input id="cOrg" type="text" placeholder="e.g. Maya's Candles" autocomplete="organization">

    <label for="cContact">Best way to reach you</label>
    <input id="cContact" type="text" inputmode="email" placeholder="Phone, email, or @instagram" autocomplete="off" required>

    <label for="cNote">Anything to remember? (optional)</label>
    <textarea id="cNote" placeholder="Wants a booth in October, plays live music, etc."></textarea>

    <button class="btn" type="submit" id="cSend">Send</button>
    <div class="status" id="cStatus"></div>
  </form>

  <div class="success" id="cDone">
    <div class="big">🤝</div>
    <h1>Got it!</h1>
    <p class="tag">Saved — we'll follow up.</p>
    <button class="btn secondary" id="cAgain" type="button">+ Add another</button>
  </div>

  <footer>
    Board Bored · <a href="../">Back to the map</a>
  </footer>
</div>

<script src="../lib/pwa.js"></script>
<script src="../lib/api.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var API_ENDPOINT = (window.bbApi && bbApi.API_BASE ? bbApi.API_BASE : "") + "/api/contact";
  var CONTACT_EMAIL = "boardquestionmark@gmail.com";

  // ?event=... labels every lead captured through this link with which event
  // it came from (e.g. a specific mixer) — falls back to a generic label so
  // the same page works with no query string too.
  var EVENT = (new URLSearchParams(location.search).get("event") || "Board Bored").trim().slice(0, 120);
  if (EVENT && EVENT !== "Board Bored") {
    $("eventPill").style.display = "inline-block";
    $("eventPill").textContent = "📍 " + EVENT;
  }

  var role = "";
  $("roles").addEventListener("click", function(e){
    var b = e.target.closest("button[data-r]");
    if (!b) return;
    Array.prototype.forEach.call($("roles").querySelectorAll("button"), function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    role = b.getAttribute("data-r");
  });

  function mailFallback(){
    var lines = [
      ["Name", $("cName").value.trim()], ["Role", role], ["Business/act", $("cOrg").value.trim()],
      ["Contact", $("cContact").value.trim()], ["Note", $("cNote").value.trim()], ["Event", EVENT],
    ];
    var body = lines.map(function(l){ return l[0] + ": " + (l[1] || "—"); }).join("\n");
    location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("New contact — " + (lines[0][1] || "")) +
                    "&body=" + encodeURIComponent(body);
  }

  function resetForm(){
    $("formConnect").reset();
    Array.prototype.forEach.call($("roles").querySelectorAll("button"), function(x){ x.classList.remove("on"); });
    role = "";
    $("cSend").disabled = false;
    $("cStatus").textContent = "";
    $("cDone").style.display = "none";
    $("formConnect").style.display = "block";
    $("cName").focus();
  }
  $("cAgain").addEventListener("click", resetForm);

  $("formConnect").addEventListener("submit", function(e){
    e.preventDefault();
    var st = $("cStatus");
    var name = $("cName").value.trim(), contact = $("cContact").value.trim();
    if (!name || !contact) {
      st.className = "status err";
      st.textContent = "Name and a way to reach you — that's all we need.";
      return;
    }
    var payload = {
      name: name, role: role, org: $("cOrg").value.trim(),
      contact: contact, note: $("cNote").value.trim(), event: EVENT,
    };

    $("cSend").disabled = true;
    st.className = "status"; st.textContent = "Sending…";

    var onSent = function(){
      $("formConnect").style.display = "none";
      $("cDone").style.display = "block";
    };
    var onQueued = function(){
      $("formConnect").style.display = "none";
      $("cDone").style.display = "block";
      $("cDone").querySelector(".tag").textContent = "Saved — you're offline, we'll send it the moment you're back on.";
    };
    var onFail = function(){
      $("cSend").disabled = false;
      st.className = "status err";
      st.textContent = "Couldn't send — try again, or email " + CONTACT_EMAIL + " directly.";
      mailFallback();
    };

    if (window.BB && window.BB.submit) {
      window.BB.submit(API_ENDPOINT, payload).then(function(res){
        if (res.queued) onQueued();
        else if (res.ok) onSent();
        else onFail();
      });
    } else {
      fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function(r){ if (r.ok) onSent(); else onFail(); }).catch(onFail);
    }
  });
})();
</script>
</body>
</html>
