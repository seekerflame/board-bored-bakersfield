<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Confirm a code — Board Bored</title>
<style>
  :root{--ink:#141116;--pap:#faf7f2;--card:#fffdfa;--line:#8a837d;--mut:#5e5852;--ok:#0b5d4a;--okbg:#d9f3ea;--bad:#a4262c;--badbg:#fbe0e1;--body:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--ink:#f4efe9;--pap:#16130f;--card:#201c17;--line:#6e665e;--mut:#b9b1a8;--ok:#8be8cc;--okbg:#10352c;--bad:#ff9ba0;--badbg:#3a1a1c}}
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:20px}
  body{font-family:var(--body);background:var(--pap);color:var(--ink);line-height:1.45;padding:16px 16px 56px;min-height:100dvh}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:1.6rem;margin-bottom:4px}
  .shop{color:var(--mut);margin-bottom:16px;font-weight:700}
  input{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2.4rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;text-align:center;width:100%;min-height:72px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  button{font:inherit;font-weight:800;min-height:64px;border-radius:14px;border:0;background:var(--ink);color:var(--pap);width:100%;margin-top:12px;cursor:pointer}
  button[disabled]{opacity:.45}
  .res{margin-top:16px;padding:16px;border-radius:14px;font-weight:700}
  .res.ok{background:var(--okbg);color:var(--ok)} .res.bad{background:var(--badbg);color:var(--bad)}
  .res .big{font-size:1.5rem;font-weight:800;display:block;margin-bottom:6px}
  .res .check{display:block;margin-top:8px;font-weight:800;color:var(--ink)}
  .small{font-size:.8rem;color:var(--mut);margin-top:20px;font-weight:400}
  .stmt{margin-top:24px;border-top:2px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Confirm a Board Bored code</h1>
  <p class="shop" id="shop"></p>
  <form id="f" autocomplete="off">
    <input id="code" inputmode="text" autocapitalize="characters" maxlength="8" placeholder="ABC123" aria-label="Customer's code">
    <input id="ticket" inputmode="decimal" maxlength="8" placeholder="Ticket total $ (optional)" aria-label="Ticket total in dollars, optional" style="font-size:1.1rem;letter-spacing:0;text-transform:none;min-height:56px;margin-top:10px">
    <button id="go" type="submit">Confirm code</button>
  </form>
  <div id="out" role="status" aria-live="polite"></div>
  <div class="stmt" id="stmt"></div>
  <p class="small">Only confirm a code when the customer is at your counter. Each confirmed code is counted once and is what Board Bored's per-redemption fee is based on.</p>
</div>
<script src="../lib/api.js"></script>
<script>
(function () {
  var API = (window.bbApi && window.bbApi.API_BASE || "").replace(/\/+$/, "");
  try { var q = new URLSearchParams(location.search).get("api"); if (q && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) API = q.replace(/\/+$/, ""); } catch (e) {}
  // The shop link carries its token in the #fragment (never sent to a server or logged), then we keep it locally and clear the bar.
  var tok = "";
  try {
    var m = /(?:^#|&)t=([^&]+)/.exec(location.hash);
    if (m) { tok = decodeURIComponent(m[1]); localStorage.setItem("bb_shop_token", tok); history.replaceState(null, "", location.pathname + location.search); }
    else tok = localStorage.getItem("bb_shop_token") || "";
  } catch (e) {}
  var out = document.getElementById("out"), code = document.getElementById("code"), go = document.getElementById("go");
  document.getElementById("shop").textContent = tok ? "Shop: " + tok.split(".")[0].replace(/-/g, " ") : "Open the link Board Bored sent your shop.";
  function say(cls, big, lines) {
    out.textContent = ""; var d = document.createElement("div"); d.className = "res " + cls;
    var b = document.createElement("span"); b.className = "big"; b.textContent = big; d.appendChild(b);
    (lines || []).forEach(function (t) { var s = document.createElement("span"); s.className = t.cls || ""; s.style.display = "block"; s.textContent = t.text; d.appendChild(s); });
    out.appendChild(d);
  }
  var REASONS = { not_found: "No such code for this shop. Check the letters and numbers.", already_redeemed: "This code was already used.", expired: "This code has expired.", deal_ended: "This deal has ended.", bad_token: "This shop link is not valid. Ask Board Bored for a new one." };
  function statement() {
    if (!tok) return;
    fetch(API + "/api/statement", { headers: { Authorization: "Bearer " + tok }, cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) return; var s = j.statement, el = document.getElementById("stmt");
      el.textContent = "This month: " + s.redemptions + " confirmed, $" + (s.totalCents / 100).toFixed(2) + " in fees (" + s.month + ")";
    }).catch(function () {});
  }
  document.getElementById("f").onsubmit = function (e) {
    e.preventDefault(); if (!tok) { say("bad", "Missing shop link", [{ text: REASONS.bad_token }]); return; }
    var c = code.value.trim(); if (!c) return;
    go.disabled = true;
    fetch(API + "/api/redeem", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ shopToken: tok, code: c, ticketTotal: document.getElementById("ticket").value }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) { say("ok", "✅ Good: give the deal", [{ text: j.summary }, { text: j.check, cls: "check" }, { text: "Fee for this one: $" + (j.feeCents / 100).toFixed(2) }]); code.value = ""; document.getElementById("ticket").value = ""; statement(); }
        else say("bad", "❌ Do not give the deal", [{ text: REASONS[j.reason] || j.error || "Something went wrong." }]);
      })
      .catch(function () { say("bad", "No connection", [{ text: "Try again in a moment. Nothing was confirmed." }]); })
      .then(function () { go.disabled = false; code.focus(); });
  };
  statement(); code.focus();
})();
</script>
</body>
</html>
